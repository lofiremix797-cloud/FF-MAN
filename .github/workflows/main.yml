name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write project files
        run: |
          mkdir -p src/main/java/com/venice/ffpanel

          cat > settings.gradle << 'EOF'
          rootProject.name = "AutoHeadshot"
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'

          android {
              namespace 'com.venice.ffpanel'
              compileSdk 34
              defaultConfig {
                  applicationId "com.venice.ffpanel"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          EOF

          cat > src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:label="FF Auto Headshot"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > src/main/java/com/venice/ffpanel/Main.kt << 'EOF'
          package com.venice.ffpanel

          import android.Manifest
          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import kotlin.math.abs
          import kotlin.math.max

          object Cfg {
              var arms = false
              var dot = 6f
              var ring = true
              var xmode = false
              var size = 16f
              var gap = 5f
              var thick = 2f
              var opacity = 0.95f
              var outline = true
              var color = 0xFF00FF88.toInt()
              var autoLock = 5
              var game = "Free Fire"

              fun preset(name: String) {
                  game = name
                  when (name) {
                      "Free Fire" -> { dot = 6f; ring = true; arms = false; xmode = false
                          size = 16f; gap = 5f; color = 0xFF00FF88.toInt(); opacity = 0.95f }
                      "FF MAX" -> { dot = 7f; ring = true; arms = false; xmode = false
                          size = 18f; gap = 6f; color = 0xFF00E5FF.toInt(); opacity = 0.95f }
                      "PUBG" -> { dot = 4f; ring = false; arms = true; xmode = false
                          size = 18f; gap = 5f; color = 0xFFFFFFFF.toInt(); opacity = 0.9f }
                      "COD" -> { dot = 5f; ring = false; arms = true; xmode = true
                          size = 14f; gap = 4f; color = 0xFFFF3B3B.toInt(); opacity = 0.95f }
                  }
              }
          }

          class CrosshairView(c: Context) : View(c) {
              var cx = -1f
              var cy = -1f
              private var lastX = 0f
              private var lastY = 0f
              var onMove: (() -> Unit)? = null
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val d = resources.displayMetrics.density

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  if (cx < 0f) { cx = w / 2f; cy = h / 2f }
              }

              override fun onDraw(canvas: Canvas) {
                  if (Cfg.outline) { p.color = Color.BLACK; p.alpha = 235; shapes(canvas, 2f * d) }
                  p.color = Cfg.color
                  p.alpha = (Cfg.opacity * 255).toInt()
                  shapes(canvas, 0f)
              }

              private fun shapes(canvas: Canvas, pad: Float) {
                  val t = Cfg.thick * d + pad
                  val off = (Cfg.gap + Cfg.size / 2f) * d
                  val len = Cfg.size * d
                  if (Cfg.ring) {
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = t
                      canvas.drawCircle(cx, cy, max(12f * d, Cfg.gap * 2 * d + len), p)
                  }
                  p.style = Paint.Style.FILL
                  if (Cfg.arms) {
                      if (Cfg.xmode) {
                          canvas.save(); canvas.rotate(45f, cx, cy); arms(canvas, t, off, len); canvas.restore()
                      } else arms(canvas, t, off, len)
                  }
                  if (Cfg.dot > 0f) canvas.drawCircle(cx, cy, Cfg.dot * d / 2f + pad / 2f, p)
              }

              private fun arms(canvas: Canvas, t: Float, off: Float, len: Float) {
                  canvas.drawRect(cx - t / 2, cy - off - len / 2, cx + t / 2, cy - off + len / 2, p)
                  canvas.drawRect(cx - t / 2, cy + off - len / 2, cx + t / 2, cy + off + len / 2, p)
                  canvas.drawRect(cx - off - len / 2, cy - t / 2, cx - off + len / 2, cy + t / 2, p)
                  canvas.drawRect(cx + off - len / 2, cy - t / 2, cx + off + len / 2, cy + t / 2, p)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { lastX = e.rawX; lastY = e.rawY; onMove?.invoke(); return true }
                      MotionEvent.ACTION_MOVE -> {
                          cx = (cx + e.rawX - lastX).coerceIn(0f, width.toFloat())
                          cy = (cy + e.rawY - lastY).coerceIn(0f, height.toFloat())
                          lastX = e.rawX; lastY = e.rawY
                          invalidate(); onMove?.invoke(); return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { onMove?.invoke(); return true }
                  }
                  return super.onTouchEvent(e)
              }
          }

          class BubbleView(c: Context) : View(c) {
              var onDrag: ((Float, Float) -> Unit)? = null
              var onTap: (() -> Unit)? = null
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val d = resources.displayMetrics.density
              private var dx = 0f
              private var dy = 0f
              private var moved = false

              override fun onDraw(canvas: Canvas) {
                  val r = width / 2f
                  p.style = Paint.Style.FILL
                  p.color = Color.argb(235, 11, 16, 23)
                  canvas.drawCircle(r, r, r - 1, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 2.5f * d
                  p.color = Color.parseColor("#00FF88")
                  canvas.drawCircle(r, r, r - 2.5f * d, p)
                  p.style = Paint.Style.FILL
                  canvas.drawCircle(r, r, 4f * d, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 2f * d
                  canvas.drawCircle(r, r, 9f * d, p)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { dx = e.rawX; dy = e.rawY; moved = false; return true }
                      MotionEvent.ACTION_MOVE -> {
                          val mx = e.rawX - dx
                          val my = e.rawY - dy
                          if (abs(mx) > 5 || abs(my) > 5) moved = true
                          onDrag?.invoke(mx, my)
                          dx = e.rawX; dy = e.rawY
                          return true
                      }
                      MotionEvent.ACTION_UP -> { if (!moved) onTap?.invoke(); return true }
                  }
                  return super.onTouchEvent(e)
              }
          }

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var cross: CrosshairView? = null
              private var crossLp: WindowManager.LayoutParams? = null
              private var bubble: BubbleView? = null
              private var bubbleLp: WindowManager.LayoutParams? = null
              private var panel: View? = null
              private var panelLp: WindowManager.LayoutParams? = null
              private val ui = Handler(Looper.getMainLooper())
              private val locker = Runnable { setUnlocked(false) }
              private var unlocked = false

              private val wType: Int
                  get() = if (Build.VERSION.SDK_INT >= 26)
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else WindowManager.LayoutParams.TYPE_PHONE

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  notif()
                  addCross()
                  addBubble()
              }

              override fun onStartCommand(i: Intent?, f: Int, s: Int) = START_STICKY

              override fun onDestroy() {
                  ui.removeCallbacksAndMessages(null)
                  cross?.let { runCatching { wm.removeView(it) } }
                  bubble?.let { runCatching { wm.removeView(it) } }
                  panel?.let { runCatching { wm.removeView(it) } }
                  super.onDestroy()
              }

              private fun notif() {
                  val ch = "ffp"
                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(
                          NotificationChannel(ch, "Panel", NotificationManager.IMPORTANCE_MIN))
                      val n = Notification.Builder(this, ch)
                          .setContentTitle("FF Auto Headshot চলছে")
                          .setSmallIcon(android.R.drawable.ic_menu_crop)
                          .setOngoing(true).build()
                      startForeground(7, n)
                  } else {
                      @Suppress("DEPRECATION")
                      val n = Notification.Builder(this)
                          .setContentTitle("FF Auto Headshot চলছে")
                          .setSmallIcon(android.R.drawable.ic_menu_crop)
                          .setOngoing(true).build()
                      startForeground(7, n)
                  }
              }

              private fun addCross() {
                  val v = CrosshairView(this)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      wType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT)
                  lp.gravity = Gravity.TOP or Gravity.START
                  v.onMove = { if (unlocked) arm() }
                  wm.addView(v, lp)
                  cross = v
                  crossLp = lp
              }

              private fun addBubble() {
                  val v = BubbleView(this)
                  val lp = WindowManager.LayoutParams(
                      dp(52), dp(52), wType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT)
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = dp(12); lp.y = dp(340)
                  v.onDrag = { mx, my ->
                      lp.x += mx.toInt(); lp.y += my.toInt()
                      runCatching { wm.updateViewLayout(v, lp) }
                      movePanel()
                  }
                  v.onTap = { togglePanel() }
                  wm.addView(v, lp)
                  bubble = v
                  bubbleLp = lp
              }

              private fun togglePanel() {
                  if (panel != null) { hidePanel(); return }
                  val v = buildPanel()
                  val lp = WindowManager.LayoutParams(
                      dp(256), WindowManager.LayoutParams.WRAP_CONTENT, wType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT)
                  lp.gravity = Gravity.TOP or Gravity.START
                  wm.addView(v, lp)
                  panel = v
                  panelLp = lp
                  movePanel()
              }

              private fun hidePanel() {
                  panel?.let { runCatching { wm.removeView(it) } }
                  panel = null
                  panelLp = null
              }

              private fun rebuild() {
                  val open = panel != null
                  hidePanel()
                  if (open) togglePanel()
              }

              private fun movePanel() {
                  val v = panel ?: return
                  val lp = panelLp ?: return
                  val b = bubbleLp ?: return
                  val dm = resources.displayMetrics
                  lp.x = (b.x + dp(60)).coerceIn(0, max(0, dm.widthPixels - dp(266)))
                  lp.y = (b.y - dp(70)).coerceIn(dp(8), max(dp(8), dm.heightPixels - dp(500)))
                  runCatching { wm.updateViewLayout(v, lp) }
              }

              private fun buildPanel(): View {
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  val bg = GradientDrawable()
                  bg.setColor(0xF20A1017.toInt())
                  bg.cornerRadius = dp(14).toFloat()
                  bg.setStroke(dp(1), 0x8000FF88.toInt())
                  root.background = bg
                  root.setPadding(dp(12), dp(10), dp(12), dp(12))

                  val t = TextView(this)
                  t.text = "AUTO HEADSHOT PANEL"
                  t.setTextColor(0xFF00FF88.toInt())
                  t.textSize = 12.5f
                  root.addView(t)

                  val g = TextView(this)
                  g.text = "গেম: " + Cfg.game
                  g.setTextColor(0xFF8FA0B4.toInt())
                  g.textSize = 11f
                  g.setPadding(0, dp(2), 0, dp(8))
                  root.addView(g)

                  val gr = LinearLayout(this); gr.orientation = LinearLayout.HORIZONTAL
                  for (n in arrayOf("Free Fire", "FF MAX", "PUBG", "COD"))
                      gr.addView(pbtn(n) { Cfg.preset(n); redraw(); rebuild() })
                  root.addView(gr)

                  root.addView(swRow("হেডশট ডট", Cfg.dot > 0f) { Cfg.dot = if (it) 6f else 0f; redraw(); rebuild() })
                  root.addView(swRow("হেডশট রিং", Cfg.ring) { Cfg.ring = it; redraw() })
                  root.addView(swRow("ক্রস আর্ম", Cfg.arms) { Cfg.arms = it; redraw() })
                  root.addView(swRow("X মোড", Cfg.xmode) { Cfg.xmode = it; redraw() })
                  root.addView(swRow("কালো বর্ডার", Cfg.outline) { Cfg.outline = it; redraw() })

                  root.addView(seekRow("ডট", Cfg.dot, 0f, 16f) { Cfg.dot = it; redraw() })
                  root.addView(seekRow("রিং", Cfg.size, 4f, 60f) { Cfg.size = it; redraw() })
                  root.addView(seekRow("মোটা", Cfg.thick, 1f, 8f) { Cfg.thick = it; redraw() })
                  root.addView(seekRow("অপাসিটি", Cfg.opacity * 100f, 20f, 100f) { Cfg.opacity = it / 100f; redraw() })
                  root.addView(seekRow("অটো লক সে.", Cfg.autoLock.toFloat(), 0f, 15f) { Cfg.autoLock = it.toInt() })

                  root.addView(colorRow())

                  val r1 = LinearLayout(this); r1.orientation = LinearLayout.HORIZONTAL
                  r1.setPadding(0, dp(10), 0, 0)
                  r1.addView(pbtn(if (unlocked) "🔒 লক" else "🔓 আনলক") { setUnlocked(!unlocked); rebuild() })
                  r1.addView(pbtn("সেন্টার") { center() })
                  root.addView(r1)

                  val r2 = LinearLayout(this); r2.orientation = LinearLayout.HORIZONTAL
                  r2.setPadding(0, dp(6), 0, 0)
                  r2.addView(pbtn("রিসেট") { Cfg.preset(Cfg.game); redraw(); rebuild() })
                  r2.addView(pbtn("বন্ধ") { hidePanel() })
                  root.addView(r2)
                  return root
              }

              private fun swRow(label: String, on: Boolean, cb: (Boolean) -> Unit): LinearLayout {
                  val r = LinearLayout(this); r.orientation = LinearLayout.HORIZONTAL
                  r.gravity = Gravity.CENTER_VERTICAL
                  val t = TextView(this); t.text = label
                  t.setTextColor(0xFFC8D3E0.toInt()); t.textSize = 12f
                  t.layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  r.addView(t)
               
